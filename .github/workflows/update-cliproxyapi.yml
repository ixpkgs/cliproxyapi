name: Update CLIProxyAPI

on:
  schedule:
    - cron: "0 */6 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cliproxyapi
  cancel-in-progress: false

jobs:
  update:
    uses: ixpkgs/auto-update-workflows/.github/workflows/update-go-module.yml@main
    with:
      discovery_mode: releases
      upstream_repository: https://github.com/router-for-me/CLIProxyAPI.git
      upstream_github_repository: router-for-me/CLIProxyAPI
      include_prereleases: false
      package_name: CLIProxyAPI
