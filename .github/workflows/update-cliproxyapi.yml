name: Update CLIProxyAPI

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cliproxyapi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      UPSTREAM_REPOSITORY: https://github.com/router-for-me/CLIProxyAPI.git
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Package new upstream tags
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          upstream_refs=$(git ls-remote --tags --refs "$UPSTREAM_REPOSITORY")
          mapfile -t pending_releases < <(
            while read -r commit ref; do
              tag=${ref#refs/tags/}

              # CLIProxyAPI also has non-release maintenance tags. Only package
              # version tags, including upstream's occasional suffixed versions.
              if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
                continue
              fi

              if ! git show-ref --verify --quiet "refs/tags/$tag"; then
                printf '%s\t%s\n' "$tag" "$commit"
              fi
            done <<< "$upstream_refs" | sort -V -k1,1
          )

          if (( ${#pending_releases[@]} == 0 )); then
            echo "No new CLIProxyAPI tags found."
            exit 0
          fi

          printf 'New CLIProxyAPI tags (oldest first):\n'
          printf '  %s\n' "${pending_releases[@]%%$'\t'*}"

          for release in "${pending_releases[@]}"; do
            IFS=$'\t' read -r tag commit <<< "$release"

            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid commit for $tag: $commit" >&2
              exit 1
            fi

            echo "Packaging $tag ($commit)"
            sed -i -E \
              -e "s|^([[:space:]]*)tag = \"[^\"]+\";|\1tag = \"$tag\";|" \
              -e "s|^([[:space:]]*)commit = \"[0-9a-f]+\";|\1commit = \"$commit\";|" \
              -e 's|^([[:space:]]*)vendorHash = "sha256-[^"]+";|\1vendorHash = pkgs.lib.fakeHash;|' \
              flake.nix

            grep -Fq "tag = \"$tag\";" flake.nix
            grep -Fq "commit = \"$commit\";" flake.nix
            grep -Fq 'vendorHash = pkgs.lib.fakeHash;' flake.nix

            set +e
            build_output=$(nix build .#default --no-link 2>&1)
            build_status=$?
            set -e

            if (( build_status == 0 )); then
              echo "The build unexpectedly succeeded with pkgs.lib.fakeHash." >&2
              exit 1
            fi

            vendor_hash=$(
              sed -nE \
                's/^[[:space:]]*got:[[:space:]]+(sha256-[A-Za-z0-9+\/=]+).*$/\1/p' \
                <<< "$build_output" | tail -n 1
            )

            if [[ -z "$vendor_hash" ]]; then
              printf '%s\n' "$build_output" >&2
              echo "Could not determine vendorHash for $tag." >&2
              exit 1
            fi

            sed -i -E \
              "s|^([[:space:]]*)vendorHash = pkgs\.lib\.fakeHash;|\1vendorHash = \"$vendor_hash\";|" \
              flake.nix

            nix build .#default --no-link
            git diff --check
            git add flake.nix
            git commit \
              -m "Package CLIProxyAPI $tag" \
              -m "Upstream commit: $commit"
            git tag "$tag"

            # Persist each release independently. If a later build fails, the
            # successfully packaged earlier releases remain available.
            git push --atomic origin \
              "HEAD:refs/heads/$TARGET_BRANCH" \
              "refs/tags/$tag"
          done
