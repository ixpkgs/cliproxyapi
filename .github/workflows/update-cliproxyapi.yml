name: Update CLIProxyAPI

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cliproxyapi
  cancel-in-progress: false

jobs:
  update:
    # Pin this reference to a full commit SHA after the reusable workflow's
    # initial publication.
    uses: ixpkgs/go-module-update-workflow/.github/workflows/update-go-module.yml@main
    with:
      upstream_repository: https://github.com/router-for-me/CLIProxyAPI.git
      package_name: CLIProxyAPI
